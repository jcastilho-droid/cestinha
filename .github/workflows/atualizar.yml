# Robô gratuito do GitHub (repositório público = grátis).
# 1) De hora em hora: coleta os jogos na ESPN e salva em data/raw/ (sem IA).
# 2) Sempre: monta o site e publica no GitHub Pages.
# Ele também roda quando o Cestinha envia textos novos (push na main).
# O projeto fica dentro da pasta cestinha/ do repositório.
name: Atualizar Cestinha

on:
  schedule:
    - cron: '17 * * * *'   # minuto 17 de toda hora (UTC)
  push:
    branches: [main]
    paths: ['cestinha/**', '.github/workflows/**']
  workflow_dispatch: {}      # botão "Run workflow" para rodar na mão

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cestinha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cestinha
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Arrumar arquivos enviados na pasta errada
        run: |
          git config user.name "cestinha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mudou=0
          for d in scripts site content prompts config; do
            if [ -d "data/$d" ]; then cp -r "data/$d/." "$d/" && git rm -rq "data/$d" && mudou=1; fi
          done
          if [ -d data/data ]; then cp -r data/data/. data/ && git rm -rq data/data && mudou=1; fi
          for f in README.md ROTINA.md package.json; do
            if [ -f "data/$f" ]; then git mv -f "data/$f" "$f" && mudou=1; fi
          done
          if [ "$mudou" = 1 ]; then
            git add -A .
            git commit -m "arrumar: move arquivos que foram enviados para dentro de data/"
            for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
          else
            echo "Tudo no lugar."
          fi

      - name: Coletar jogos (ESPN)
        if: github.event_name != 'push'
        run: node scripts/coletar.js

      - name: Salvar dados coletados no repositório
        if: github.event_name != 'push'
        continue-on-error: true   # se falhar, o site é publicado mesmo assim
        run: |
          git config user.name "cestinha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada novo na coleta."
          else
            git commit -m "coleta: dados de $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi

      - name: Montar o site
        run: node scripts/build.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cestinha/_site
      - id: publicar
        uses: actions/deploy-pages@v4
