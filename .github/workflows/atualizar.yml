# Robô gratuito do GitHub (repositório público = grátis).
# 1) De hora em hora: coleta os jogos na ESPN e salva em data/raw/ (sem IA).
# 2) Sempre: monta o site e publica no GitHub Pages.
# Ele também roda quando o Cestinha envia textos novos (push na main).
name: Atualizar Cestinha

on:
  schedule:
    - cron: '17 * * * *'   # minuto 17 de toda hora (UTC)
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**', 'site/**', 'data/**', '.github/workflows/**']
  workflow_dispatch: {}      # botão "Run workflow" para rodar na mão

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cestinha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar jogos (ESPN)
        if: github.event_name != 'push'
        run: node scripts/coletar.js

      - name: Salvar dados coletados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "cestinha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "Nada novo na coleta."
          else
            git commit -m "coleta: dados de $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi

      - name: Montar o site
        run: node scripts/build.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicar
        uses: actions/deploy-pages@v4
