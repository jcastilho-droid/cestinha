name: Verificar Cestinha Stats

on:
  push:
    branches: ['feature/cestinha-stats-v1']
  pull_request:
    paths:
      - 'cestinha/scripts/**'
      - 'cestinha/site/assets/**'
      - '.github/workflows/stats-check.yml'

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cestinha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir sintaxe
        run: |
          node --check scripts/build.js
          node --check scripts/cartoes.js
          node --check scripts/stats.js
          node --check site/assets/stats.js
          node --check site/assets/carrossel-home.js
          node --check scripts/test-home-carousel.js
          node --check scripts/test-stats-explorer.js
      - name: Instalar gerador de imagens
        run: npm install --no-audit --no-fund --omit=dev
      - name: Gerar site completo
        run: node scripts/build.js
      - name: Validar explorador de jogos
        run: node scripts/test-stats-explorer.js
      - name: Conferir historico individual consolidado
        run: node scripts/test-stats-history.js
      - name: Conferir a TV brasileira e a tabela no celular
        run: node scripts/test-tv-br.js
      - name: Conferir destaques editoriais e links da home
        run: node scripts/test-home-carousel.js
      - name: Validar pagina e links
        run: |
          test -s _site/stats.html
          test -s _site/assets/stats.css
          test -s _site/assets/stats.js
          grep -q 'CESTINHA' _site/stats.html
          grep -q 'stats.html' _site/index.html
          grep -q 'id="stats-dados"' _site/stats.html
          grep -q 'id="stats-partida"' _site/stats.html

      - name: Validar imagens compartilháveis
        run: |
          test -d _site/cartoes
          find _site/cartoes -name '*.png' -size +20k | grep -q .
          find _site/cartoes -name '*-story.png' -size +20k | grep -q .
          grep -R -q 'cartoes/' _site/jogo
